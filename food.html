<!DOCTYPE html>
<html lang="en">
<head>
  <title>WebApp Program 5</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
</head>
<body>
  <div class = "container">

    <h1>Dinner time by</h1>
    <h2>Cael Meacham</h2>

    <div class = "row">
      <div class = "col-sm-2">M</div>
      <div class = "col-sm-2">E</div>
      <div class = "col-sm-2">A</div>
      <div class = "col-sm-2">C</div>
      <div class = "col-sm-2">H</div>
      <div class = "col-sm-2">A</div>
    </div>

    <div class = "row">
      <div class = "col-md">Mushrooms</div>
      <div class = "col-md">Empanada</div>
      <div class = "col-md">Apple</div>
      <div class = "col-md">Calamari</div>
      <div class = "col-md">Ham</div>
      <div class = "col-md">Apricot</div>
    </div>

      <h3>Which row breaks first?</h3>
      <p>Answer: The foods row breaks first because is the
        size of the class, foods is a medium class size
        so it breaks before the smaller class size.</p>

  </div>

<div class="container my-4">
  <h3 class="mb-3">Normal Food Images</h3>
  <!-- Container 1: Responsive standard images -->
  <div class="row">
    <div class="col-md-4 mb-3">
      <img src="mushrooms.jpg" alt="Mushrooms" class="img-fluid rounded" style="max-width: 450px;">
    </div>
    <div class="col-md-4 mb-3">
      <img src="empanada.jpg" alt="Empanada" class="img-fluid rounded" style="max-width: 450px;">
    </div>
    <div class="col-md-4 mb-3">
      <img src="apple.jpg" alt="Apple" class="img-fluid rounded" style="max-width: 450px;">
    </div>
  </div>

  <h3 class="my-3">Thumbnail Food Images</h3>
  <div class="row">
    <div class="col-md-4 mb-3">
      <img src="mushrooms.jpg" alt="Mushrooms Thumbnail" class="img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;">
    </div>
    <div class="col-md-4 mb-3">
      <img src="empanada.jpg" alt="Empanada Thumbnail" class="img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;">
    </div>
    <div class="col-md-4 mb-3">
      <img src="apple.jpg" alt="Apple Thumbnail" class="img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;">
    </div>
  </div>
</div>

</body>
</html>
